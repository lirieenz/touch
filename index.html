<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#000000">

<title></title>



<style>

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

}

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #000;

  color: #fff;

  font-family: Arial, Helvetica, sans-serif;

}

body { touch-action: none; }

button, input, select, textarea { font: inherit; }

button { cursor: pointer; }

.screen {

  width: 100%;

  height: 100%;

  display: none;

  position: relative;

}

.screen.active { display: flex; }



/* HOME */

#homeScreen {

  align-items: center;

  justify-content: center;

  flex-direction: column;

  padding: 25px;

}

.title {

  font-size: 32px;

  font-weight: 700;

  margin-bottom: 8px;

  text-align: center;

}

.subtitle {

  color: #999;

  font-size: 14px;

  margin-bottom: 35px;

  text-align: center;

}

.home-card {

  width: min(420px, 100%);

  background: #111;

  border: 1px solid #222;

  border-radius: 18px;

  padding: 25px;

}

.home-card h2 { margin: 0 0 18px; font-size: 20px; }

.input-label {

  display: block;

  font-size: 12px;

  color: #999;

  margin-bottom: 7px;

}

input, select {

  width: 100%;

  height: 48px;

  background: #181818;

  color: #fff;

  border: 1px solid #333;

  border-radius: 10px;

  padding: 0 14px;

  outline: none;

}

input:focus, select:focus { border-color: #666; }

.field { margin-bottom: 15px; }

.button-row { display: flex; gap: 10px; margin-top: 18px; }

.btn {

  flex: 1;

  height: 48px;

  border: none;

  border-radius: 10px;

  font-weight: 700;

  color: #fff;

  background: #222;

}

.btn.primary { background: #e50914; }

.btn:active { transform: scale(.98); }

.status {

  text-align: center;

  color: #777;

  font-size: 12px;

  margin-top: 18px;

  min-height: 16px;

}

.room-code {

  margin-top: 15px;

  padding: 15px;

  border-radius: 12px;

  background: #181818;

  text-align: center;

  display: none;

}

.room-code.visible { display: block; }

.room-code-label { color: #777; font-size: 10px; margin-bottom: 7px; }

.room-code-value { font-size: 28px; font-weight: 700; letter-spacing: 5px; }

.room-code-hint { color: #666; font-size: 11px; margin-top: 7px; }



/* CONTROLLER */

#controllerScreen { background: #000; flex-direction: column; }

#controllerCanvas {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

  z-index: 1;

  touch-action: none;

}

.controller-top {

  position: absolute;

  z-index: 5;

  top: 15px;

  left: 15px;

  right: 15px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  pointer-events: none;

}

.connection-pill {

  background: rgba(20,20,20,.85);

  border: 1px solid #292929;

  border-radius: 999px;

  padding: 8px 12px;

  font-size: 11px;

  color: #aaa;

  pointer-events: auto;

}

.connection-pill.connected { color: #8cff9a; }

.controller-controls {

  position: absolute;

  z-index: 5;

  left: 15px;

  right: 15px;

  bottom: 18px;

  display: flex;

  gap: 10px;

  align-items: center;

}

.mode-select { flex: 1; height: 46px; background: rgba(20,20,20,.92); }

.heart-btn {

  width: 52px;

  height: 46px;

  border: none;

  border-radius: 10px;

  background: #222;

  color: #fff;

  font-size: 23px;

}

.heart-btn:active { transform: scale(.94); }

.finger-info {

  position: absolute;

  z-index: 5;

  top: 58px;

  left: 15px;

  font-size: 11px;

  color: #666;

  pointer-events: none;

}



/* RECEIVER */

#receiverScreen {

  background: #000;

  align-items: center;

  justify-content: center;

  flex-direction: column;

}

.receiver-status {

  position: absolute;

  top: 20px;

  left: 0;

  right: 0;

  text-align: center;

  color: #555;

  font-size: 11px;

  z-index: 3;

}

.receiver-heart {

  position: absolute;

  font-size: 110px;

  opacity: 0;

  transform: scale(.5);

  pointer-events: none;

  z-index: 10;

}

.receiver-heart.show { animation: heartPop .7s ease-out; }

@keyframes heartPop {

  0% { opacity: 0; transform: scale(.4); }

  25% { opacity: 1; transform: scale(1.15); }

  60% { opacity: 1; transform: scale(1); }

  100% { opacity: 0; transform: scale(1.35); }

}

.lock-overlay {

  position: absolute;

  inset: 0;

  z-index: 50;

  background: rgba(0,0,0,.96);

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

  padding: 25px;

}

.lock-overlay.active { display: flex; }

.lock-icon { font-size: 52px; margin-bottom: 15px; }

.lock-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }

.lock-text {

  color: #777;

  font-size: 13px;

  line-height: 1.5;

  margin-bottom: 25px;

}

.unlock-btn {

  background: #222;

  border: 1px solid #333;

  color: #fff;

  padding: 12px 22px;

  border-radius: 10px;

}

.receiver-bottom {

  position: absolute;

  bottom: 20px;

  left: 0;

  right: 0;

  text-align: center;

  color: #333;

  font-size: 10px;

  pointer-events: none;

}



/* CONNECTING */

.connecting {

  position: fixed;

  inset: 0;

  background: #000;

  z-index: 100;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  text-align: center;

}

.connecting.active { display: flex; }

.spinner {

  width: 28px;

  height: 28px;

  .chat-bubble audio {
  display: block;
  width: min(240px, 68vw);
  max-width: 100%;
  height: 36px;
}
.chat-composer {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  padding: 10px;
  border-top: 1px solid #242424;
  background: #101010;
}
.chat-input {
  flex: 1;
  min-width: 0;
  max-height: 96px;
  resize: none;
  border: 1px solid #333;
  border-radius: 12px;
  outline: none;
  padding: 10px 11px;
  background: #191919;
  color: #fff;
  font: 13px Arial, sans-serif;
  touch-action: auto;
  user-select: text;
  -webkit-user-select: text;
}
.chat-input:focus { border-color: #8d3037; }
.chat-send, .chat-record, .chat-attach {
  width: 39px;
  height: 40px;
  flex: 0 0 39px;
  border: 0;
  border-radius: 12px;
  background: #e3343e;
  color: #fff;
  font-size: 17px;
}
.chat-record, .chat-attach {
  background: #242424;
  border: 1px solid #383838;
}
.chat-record.recording { background: #e3343e; animation: recordPulse 1s infinite; }
.chat-status {
  color: #e88b90;
  font-size: 10px;
  min-height: 13px;
  padding: 0 11px 5px;
  background: #101010;
}
.chat-footnote {
  padding: 0 11px 9px;
  color: #626262;
  background: #101010;
  font-size: 9px;
  line-height: 1.4;
}
.discreet .chat-bubble .chat-content { filter: blur(7px); }
.discreet .chat-bubble:hover .chat-content,
.discreet .chat-bubble:active .chat-content { filter: none; }
@keyframes recordPulse { 50% { opacity: .55; } }

/* MEDIA ATTACHMENTS: PREVIEW ONLY AFTER CLICK */
.media-attachment {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 175px;
  max-width: 240px;
  padding: 12px;
  background: #202020;
  border: 1px solid #3a3a3a;
  color: #fff;
  border-radius: 10px;
  text-align: left;
}
.mine .media-attachment { background: #481b20; border-color: #6a292f; }
.media-attachment-icon { font-size: 25px; }
.media-attachment-title { font-size: 12px; font-weight: 700; }
.media-attachment-hint { font-size: 10px; color: #aaa; margin-top: 4px; }
.media-preview {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0,0,0,.94);
  touch-action: manipulation;
}
.media-preview.open { display: flex; }
.media-preview-content {
  width: min(700px, 100%);
  max-height: 90dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.media-preview img, .media-preview video {
  display: block;
  max-width: 100%;
  max-height: 78dvh;
  object-fit: contain;
  border-radius: 10px;
  background: #111;
}
.media-preview-close {
  align-self: flex-end;
  border: 1px solid #444;
  background: #222;
  color: #fff;
  border-radius: 10px;
  padding: 10px 14px;
}
.hidden-file { display: none; }

@media (max-width: 420px) {
  .companion-panel {
    right: 8px;
    bottom: 76px;
    width: calc(100vw - 16px);
    height: min(560px, calc(100dvh - 100px));
  }
  .companion-launcher { right: 12px; bottom: 12px; }
}

/* PASTEL COUPLES THEME */
:root { --touch-pink: #FAD2D2; --touch-blue: #E6F6FA; --touch-ink: #563D48; --touch-muted: #8B7380; --touch-line: #E7C6CC; --touch-rose: #D9879C; }
html, body { background: var(--touch-blue); color: var(--touch-ink); }
#homeScreen { background: linear-gradient(145deg, var(--touch-pink), var(--touch-blue)); }
.home-card { background: rgba(255,255,255,.78); border-color: #E8C2CA; box-shadow: 0 18px 55px #9D71801c; color: var(--touch-ink); }
.title, .home-card h2 { color: var(--touch-ink); }
.subtitle, .input-label, .status { color: var(--touch-muted); }
input, select { background: #fff; color: var(--touch-ink); border-color: #E7C6CC; }
input:focus, select:focus { border-color: var(--touch-rose); }
.btn { background: var(--touch-blue); color: #416D7A; border: 1px solid #CDE9EF; }
.btn.primary { background: var(--touch-pink); color: #754B5B; border: 1px solid #E6B9C4; }
.room-code { background: var(--touch-blue); color: var(--touch-ink); }
.room-code-label, .room-code-hint { color: var(--touch-muted); }
#controllerScreen, #receiverScreen { background: var(--touch-blue); }
#controllerCanvas { background: radial-gradient(ellipse at 50% 42%, #FAD2D2 0%, #E6F6FA 72%); }
.connection-pill { background: #ffffffdc; border-color: #D5E9ED; color: #6E8790; }
.connection-pill.connected { color: #47856D; }
.mode-select { background: #fff; color: var(--touch-ink); }
.heart-btn { background: var(--touch-pink); color: #B65E7B; }
.finger-info, .receiver-status, .receiver-bottom { color: #7C9AA3; }
.receiver-heart { color: #D9879C; }
.lock-overlay { background: #E6F6FAf5; color: var(--touch-ink); }
.lock-title { color: var(--touch-ink); }
.lock-text { color: #6F8C95; }
.unlock-btn { background: var(--touch-pink); color: #754B5B; border-color: #E6B9C4; }
.connecting { background: #E6F6FA; }
.spinner { border-color: #CDE9EF; border-top-color: #D9879C; }
.connecting-text { color: #6F8C95; }
.companion-launcher { background: var(--touch-pink); border-color: #E6B9C4; color: #9A526D; box-shadow: 0 6px 24px #9D718026; }
.companion-panel { background: #F8FEFF; border-color: #D3EAF0; box-shadow: 0 12px 40px #6E92951f; color: var(--touch-ink); }
.companion-header, .chat-composer, .chat-status, .chat-footnote { background: #F0FAFC; border-color: #D7EBEF; }
.companion-heading { color: #563D48; }
.companion-subheading, .chat-meta, .chat-footnote { color: #8B9DA2; }
.chat-tool { background: #fff; color: #6C6870; border-color: #D8E8EB; }
.chat-tool.danger { color: #B65E7B; }
.chat-bubble { background: #E6F6FA; border-color: #CFE8EE; color: #4C5960; }
.chat-bubble.mine { background: #FAD2D2; border-color: #E9BDC7; color: #563D48; }
.chat-meta { color: #927D87; }}
